# ===================================================================
# JobPilot 前端 Nginx 配置
#
# 设计思路：
#   每个请求到 nginx 后按路径分流 —
#   /agent/* 和 /upload → 代理到后端 FastAPI（容器名: backend, 端口 8000）
#   / 和其余路径   → 返回前端静态文件（Vue SPA, try_files 兜底到 index.html）
# ===================================================================

server {
    listen 80;
    server_name localhost;

    # gzip 压缩 — 减小传输体积，JS/CSS/HTML 通常能压缩到 30% 以下
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ============================================================
    # API 代理 — 匹配 /agent/* /upload /auth/* /status 转发到后端
    # ============================================================
    location /agent/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE 长连接支持 — 不缓冲响应，否则流式输出会被攒成一大块
        proxy_buffering off;
        proxy_cache off;
    }

    location /upload {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /status {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /applications/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /applications {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /resumes {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /profile {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ============================================================
    # 前端静态文件 — Vue SPA 路由 fallback
    # ============================================================
    location / {
        root /usr/share/nginx/html;
        index index.html;

        # SPA 的关键配置：
        # 先尝试精确匹配文件，找不到就返回 index.html
        # 这样 Vue Router 的前端路由 (/about, /settings 等) 不会 404
        try_files $uri $uri/ /index.html;
    }
}
